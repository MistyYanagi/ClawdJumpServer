name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (WebSocket transport)
        run: cargo test --workspace --locked
      - name: End-to-end over HTTP long-polling
        if: runner.os != 'Windows'
        env:
          CJS_TEST_TRANSPORT: http
        run: cargo test -p cjs-tests --locked
      - name: Landlock enforcement (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p cjs-sandbox --test enforce --locked -- --nocapture
      - name: Release build
        run: cargo build --release --locked --bin cjs-server --bin cjs-device --bin cjs --bin cjsctl

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
